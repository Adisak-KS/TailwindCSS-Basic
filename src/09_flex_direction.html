<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox (Flex Direction)</title>
    <link rel="stylesheet" href="./output.css">
</head>

<body>
    <div class="bg-yellow-500 mb-8 w-auto flex">
        <div class="w-10 h-10 bg-red-500">Box 1</div>
        <div class="w-10 h-10 bg-red-500">Box 2</div>
        <div class="w-10 h-10 bg-red-500">Box 3</div>
    </div>
    <div class="bg-yellow-500 mb-8 w-auto flex flex-row-reverse">
        <div class="w-10 h-10 bg-red-500">Box 1</div>
        <div class="w-10 h-10 bg-red-500">Box 2</div>
        <div class="w-10 h-10 bg-red-500">Box 3</div>
    </div>
    <hr>
    <div class="bg-yellow-500 mb-8 w-auto flex flex-col">
        <div class="w-10 h-10 bg-red-500">Box 1</div>
        <div class="w-10 h-10 bg-red-500">Box 2</div>
        <div class="w-10 h-10 bg-red-500">Box 3</div>
    </div>
</body>

</html>
