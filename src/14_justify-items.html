<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justify-Items</title>
    <link rel="stylesheet" href="./output.css">
</head>

<body>
    <div class="bg-yellow-500 mb-8 w-auto grid justify-items-start">
        <div class="h-10 bg-red-500">Box 1</div>
        <div class="h-10 bg-red-500">Box 2</div>
        <div class="h-10 bg-red-500">Box 3</div>
    </div>
    <div class="bg-yellow-500 mb-8 w-auto grid justify-items-center">
        <div class="h-10 bg-red-500">Box 1</div>
        <div class="h-10 bg-red-500">Box 2</div>
        <div class="h-10 bg-red-500">Box 3</div>
    </div>
    <div class="bg-yellow-500 mb-8 w-auto grid justify-items-end">
        <div class="h-10 bg-red-500">Box 1</div>
        <div class="h-10 bg-red-500">Box 2</div>
        <div class="h-10 bg-red-500">Box 3</div>
    </div>
    <div class="bg-yellow-500 mb-8 w-auto grid justify-items-stretch">
        <div class="h-10 bg-red-500">Box 1</div>
        <div class="h-10 bg-red-500">Box 2</div>
        <div class="h-10 bg-red-500">Box 3</div>
    </div>

</body>

</html>
