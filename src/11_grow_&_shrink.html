<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grow & Shrink</title>
    <link rel="stylesheet" href="./output.css">
</head>

<body>
    <div class="bg-yellow-500 mb-8 w-auto flex flex-wrap">
        <div class="w-80 h-10 bg-red-500 flex-1">Box 1</div>
        <div class="w-80 h-10 bg-red-500 flex-1">Box 2</div>
        <div class="w-80 h-10 bg-red-500 flex-1">Box 3</div>
    </div>
    <div class="bg-yellow-500 mb-8 w-auto flex flex-wrap">
        <div class="w-80 h-10 bg-red-500">Box 1</div>
        <div class="w-80 h-10 bg-blue-500 flex-grow">Box 2</div>
        <div class="w-80 h-10 bg-green-500">Box 3</div>
    </div>
    <div class="bg-yellow-500 mb-8 w-auto flex flex-wrap">
        <div class="w-80 h-10 bg-red-500">Box 1</div>
        <div class="w-80 h-10 bg-blue-500 flex-shrink">Box 2</div>
        <div class="w-80 h-10 bg-green-500">Box 3</div>
    </div>
    <div class="bg-yellow-500 mb-8 w-auto flex flex-wrap">
        <div class="w-80 h-10 bg-red-500 flex-auto">Box 1</div>
        <div class="w-80 h-10 bg-blue-500 flex-shrink">Box 2</div>
        <div class="w-80 h-10 bg-green-500">Box 3</div>
    </div>

</body>

</html>
