<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการเส้นขอบ</title>
    <link rel="stylesheet" href="./output.css">
</head>

<body>
    <button class="bg-green-500 text-white m-10 p-5 border border-red-500">Click</button>
    <button class="bg-green-500 text-white m-10 p-5 border-8 border-red-500">Click</button>
    <button class="bg-green-500 text-white m-10 p-5 border-red-500 border-x-8">Click</button>
    <hr>
    <button class="bg-green-500 text-white m-10 p-5 rounded">rounded</button>
    <button class="bg-green-500 text-white m-10 p-5 rounded-sm">sm</button>
    <button class="bg-green-500 text-white m-10 p-5 rounded-md">md</button>
    <button class="bg-green-500 text-white m-10 p-5 rounded-lg">lg</button>
    <button class="bg-green-500 text-white m-10 p-5 rounded-2xl">2xl</button>
    <button class="bg-green-500 text-white m-10 p-5 rounded-3xl">3xl</button>
    <button class="bg-green-500 text-white m-10 p-5 rounded-full">Full</button>
    <hr>
    <button class="bg-green-500 text-white m-10 p-5 rounded-md">rounded</button>
    <button class="bg-green-500 text-white m-10 p-5 rounded-t-md">rounded</button>
    <button class="bg-green-500 text-white m-10 p-5 rounded-b-md">rounded</button>
    <hr>
    <button class="bg-green-500 text-white m-10 p-5 border-8 border-red-500 border-solid">rounded</button>
    <button class="bg-green-500 text-white m-10 p-5 border-8 border-red-500 border-dashed">rounded</button>
</body>

</html>
